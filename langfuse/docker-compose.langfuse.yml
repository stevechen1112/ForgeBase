# Langfuse v3 — ForgeBase self-hosted observability stack
#
# Start (standalone):
#   docker compose -f langfuse/docker-compose.langfuse.yml --env-file langfuse/.env.langfuse up -d
#
# UI:        http://localhost:3030
# SDK host:  http://localhost:3030  (set as LANGFUSE_HOST in api/.env)
#
# Prerequisites:
#   Copy langfuse/.env.langfuse.example → langfuse/.env.langfuse
#   Fill ALL values marked CHANGE_ME before first start.
#
# First-boot initialisation (LANGFUSE_INIT_* vars) creates the org, project,
# and admin user automatically. It is idempotent — safe to leave in .env.langfuse.

services:

  # ── Web server — serves UI and ingest API ────────────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_started
      langfuse-minio:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3030}:3000"
    env_file:
      - .env.langfuse
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Async worker — processes queued traces and evals ─────────────────────────
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_started
      langfuse-minio:
        condition: service_healthy
    env_file:
      - .env.langfuse

  # ── PostgreSQL — transactional data (users, projects, prompts) ───────────────
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Keep timezone UTC — required by Langfuse (see self-hosting docs).
    command: postgres -c timezone=UTC
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD is required}
      POSTGRES_DB: langfuse
      TZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── ClickHouse — OLAP store for traces, observations, scores ─────────────────
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD is required}
      TZ: UTC
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1' | clickhouse-client --user langfuse --password $${CLICKHOUSE_PASSWORD} -q 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis — queue and cache ───────────────────────────────────────────────────
  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO — local S3-compatible blob storage ─────────────────────────────────
  langfuse-minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c "minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_ACCESS_KEY_ID:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-langfuse_minio_secret}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MinIO bucket init — creates required buckets on first boot ───────────────
  langfuse-minio-init:
    image: minio/mc:latest
    depends_on:
      langfuse-minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c "
      mc alias set langfuse http://langfuse-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing langfuse/langfuse-events &&
      mc mb --ignore-existing langfuse/langfuse-media &&
      echo 'Buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_ACCESS_KEY_ID:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-langfuse_minio_secret}

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
