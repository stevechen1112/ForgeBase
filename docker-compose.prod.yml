name: forgebase

# 生產部署：單一網域 + Caddy 自動 HTTPS
# 路由：/ → ForgeBase 官網 ｜ /northforge-tools → 真實案例 ｜ /templates → 範本 ｜ /backend → admin ｜ /api → api
# 變數來源：repo 根目錄 .env（參考 deploy/compose.env.example）

# api 與 migrate 共用的環境變數（anchor，避免 migrate 因缺 URL 設定被 production 驗證擋下）
x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-forgebase}
  APP_URL: ${PROTOCOL:-https}://${DOMAIN:?missing DOMAIN in .env}
  FRONTEND_URL: ${PROTOCOL:-https}://${DOMAIN}/northforge-tools
  ADMIN_URL: ${PROTOCOL:-https}://${DOMAIN}/backend
  ALLOWED_ORIGINS: ${PROTOCOL:-https}://${DOMAIN},https://axisform.172-233-64-5.sslip.io
  WEB_REVALIDATE_URL: http://web_reference:3000/northforge-tools/api/revalidate
  WEB_REVALIDATE_URLS: http://web_reference:3000/northforge-tools/api/revalidate,http://web:3000/api/revalidate
  PUBLIC_TENANT_HEADER_COMPATIBILITY_ENABLED: "false"
  PUBLIC_TENANT_SLUG: ""
  TENANT_ROUTING_SECRET: ${TENANT_ROUTING_SECRET:?missing TENANT_ROUTING_SECRET in .env}
  TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-forgebase.com}
  TENANT_CNAME_TARGET: ${TENANT_CNAME_TARGET:-edge.forgebase.com}
  DOMAIN_DNS_RESOLVER_URL: ${DOMAIN_DNS_RESOLVER_URL:-https://cloudflare-dns.com/dns-query}
  DOMAIN_DNS_TIMEOUT_SECONDS: ${DOMAIN_DNS_TIMEOUT_SECONDS:-8}
  # AgentOS is optional. Empty must override the application development
  # default; otherwise production calls its own API at localhost:8000/tasks.
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forgebase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    # Keep migrations and the API on the exact same immutable application image.
    # Without this explicit image name Compose creates a separate
    # forgebase-migrate image, which can silently lag behind forgebase-api.
    image: forgebase-api
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    env_file: ${API_ENV_FILE:-./deploy/api.env}
    environment: *api-env
    command: alembic upgrade head
    restart: "no"

  api:
    image: forgebase-api
    build: ./api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ${API_ENV_FILE:-./deploy/api.env}
    environment: *api-env
    volumes:
      - uploads_data:/app/uploads
      - ./backups/recovery-evidence:/recovery-evidence:ro
    # APScheduler runs inside the API lifespan, so production intentionally uses
    # one worker to guarantee each scheduled job executes exactly once.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s

  admin:
    image: forgebase-admin
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${PROTOCOL:-https}://${DOMAIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  marketing:
    image: forgebase-marketing
    build:
      context: ./forgebase-site
      args:
        NEXT_PUBLIC_API_URL: ${PROTOCOL:-https}://${DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped

  templates:
    image: forgebase-templates
    build:
      context: ./template-demos
    restart: unless-stopped

  web:
    image: forgebase-web
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PROTOCOL:-https}://${DOMAIN}
        NEXT_PUBLIC_TENANT_SLUG: ""
        NEXT_PUBLIC_SITE_URL: https://${TENANT_BASE_DOMAIN:-forgebase.com}
        NEXT_PUBLIC_SITE_NAME: ForgeBase Managed Site
        NEXT_PUBLIC_BASE_PATH: ""
        NEXT_PUBLIC_ASSET_BASE: ""
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        FORGEBASE_TENANT_HOST_OVERRIDE: ""
    environment:
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${PROTOCOL:-https}://${DOMAIN}
      NEXT_PUBLIC_BASE_PATH: ""
      TENANT_ROUTING_SECRET: ${TENANT_ROUTING_SECRET:?missing TENANT_ROUTING_SECRET in .env}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?missing REVALIDATE_SECRET in .env}
    volumes:
      - ./demo:/demo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Legacy reference site remains path-based. It uses an explicit active
  # tenant hostname so public header compatibility can remain disabled.
  web_reference:
    image: forgebase-web-reference
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PROTOCOL:-https}://${DOMAIN}
        NEXT_PUBLIC_TENANT_SLUG: ""
        NEXT_PUBLIC_SITE_URL: ${PROTOCOL:-https}://${DOMAIN}/northforge-tools
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-NorthForge Tools}
        NEXT_PUBLIC_BASE_PATH: /northforge-tools
        NEXT_PUBLIC_ASSET_BASE: /northforge-tools/demo/handtool-company/assets
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        FORGEBASE_TENANT_HOST_OVERRIDE: ${REFERENCE_TENANT_HOST:-default-tenant.forgebase.com}
    environment:
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${PROTOCOL:-https}://${DOMAIN}
      NEXT_PUBLIC_TENANT_SLUG: ""
      NEXT_PUBLIC_BASE_PATH: /northforge-tools
      FORGEBASE_TENANT_HOST_OVERRIDE: ${REFERENCE_TENANT_HOST:-default-tenant.forgebase.com}
      TENANT_ROUTING_SECRET: ${TENANT_ROUTING_SECRET:?missing TENANT_ROUTING_SECRET in .env}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?missing REVALIDATE_SECRET in .env}
    volumes:
      - ./demo:/demo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/northforge-tools/api/health/assets"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      APEX_DOMAIN: ${APEX_DOMAIN:?missing APEX_DOMAIN in .env}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-forgebase.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
      web:
        condition: service_healthy
      web_reference:
        condition: service_healthy
      marketing:
        condition: service_started
      templates:
        condition: service_started

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
