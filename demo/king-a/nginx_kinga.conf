# === HTTPS for king-a-growth.com (King-A 獨立實例) ===
# 與 mitselect.com (demo) 完全獨立的 nginx 配置
# Port 對應：API=8001, Web=3002, Admin=3003
#
# 安裝方式：
#   1. 複製此檔到 /etc/nginx/sites-available/king-a-growth.conf
#   2. ln -s /etc/nginx/sites-available/king-a-growth.conf /etc/nginx/sites-enabled/
#   3. certbot --nginx -d king-a-growth.com -d www.king-a-growth.com
#   4. nginx -t && systemctl reload nginx

server {
    server_name king-a-growth.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API (port 8001) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    # ── Admin (port 3003) ──
    location /backend {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Web 前台 (port 3002) ──
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # SSL — certbot 會自動填入
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/king-a-growth.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/king-a-growth.com/privkey.pem;
}

# === www -> non-www redirect ===
server {
    server_name www.king-a-growth.com;
    return 301 https://king-a-growth.com$request_uri;

    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/king-a-growth.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/king-a-growth.com/privkey.pem;
}

# === HTTP -> HTTPS redirect ===
server {
    listen 80;
    server_name king-a-growth.com www.king-a-growth.com;
    return 301 https://king-a-growth.com$request_uri;
}
