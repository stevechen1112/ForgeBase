# King-A 獨立部署 — 與 demo (mitselect.com) 完全隔離
# 使用不同 port + 不同 DB，避免互相影響
#
# 啟動方式：
#   cd demo/king-a
#   docker compose up -d
#
# 或從專案根目錄：
#   docker compose -f demo/king-a/docker-compose.yml up -d

version: '3.9'

services:
  db-kinga:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgebase_kinga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinga_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-forgebase_kinga}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - kinga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgebase_kinga}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-kinga:
    build:
      context: ../../api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db-kinga:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgebase_kinga}:${POSTGRES_PASSWORD:-kinga_dev_2026}@db-kinga:5432/${POSTGRES_DB:-forgebase_kinga}
    env_file:
      - .env
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ../../api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web-kinga:
    build:
      context: ../../web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api-kinga
    environment:
      NEXT_PUBLIC_API_URL: http://api-kinga:8000
      INTERNAL_API_URL: http://api-kinga:8000
      NEXT_PUBLIC_SITE_NAME: "King-A 欣榮焊接"
      NEXT_PUBLIC_SITE_DOMAIN: "king-a-growth.com"
    ports:
      - "${WEB_PORT:-3002}:3000"

  admin-kinga:
    build:
      context: ../../admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api-kinga
    environment:
      NEXT_PUBLIC_API_URL: http://api-kinga:8000
    ports:
      - "${ADMIN_PORT:-3003}:3000"

volumes:
  kinga_postgres_data:
