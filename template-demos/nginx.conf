server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /templates {
    return 308 /templates/;
  }

  location = /templates/ {
    try_files /index.html =404;
  }

  location /templates/_next/ {
    rewrite ^/templates/(.*)$ /$1 break;
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /templates/ {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
