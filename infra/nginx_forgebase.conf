# === HTTPS for mitselect.com (non-www canonical) ===
server {
    server_name mitselect.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # /docs and /openapi.json are disabled in production (FastAPI returns 404)
    # Block at nginx level to avoid information leakage in security scans
    location /docs  { return 404; }
    location /redoc { return 404; }
    location /openapi.json { return 404; }

    location /backend {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets — immutable, 1 year cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimisation endpoint
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve demo static assets directly; fall back to Next.js for files not yet
    # generated (e.g. SVG fallback via route.ts for missing product PNGs)
    location /demo/ {
        alias /opt/forgebase/app/web/public/demo/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @nextjs_proxy;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location @nextjs_proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mitselect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitselect.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# === www -> non-www HTTPS redirect ===
server {
    server_name www.mitselect.com;
    return 301 https://mitselect.com$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mitselect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitselect.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# === HTTP -> HTTPS redirect ===
server {
    listen 80;
    server_name mitselect.com www.mitselect.com;
    return 301 https://mitselect.com$request_uri;
}

# === Block raw IP access ===
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/mitselect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitselect.com/privkey.pem;
    return 444;
}
