# === HTTPS for sales.mitselect.com — ForgeBase Sales Landing ===
server {
    server_name sales.mitselect.com;

    root /opt/forgebase/sales;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # Landing page — index
    location = / {
        try_files /index.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Static image assets — long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Favicon / robots
    location = /robots.txt {
        return 200 "User-agent: *\nAllow: /\nSitemap: https://sales.mitselect.com/sitemap.xml\n";
        add_header Content-Type text/plain;
    }

    # Redirect /backend login link to main site
    location /backend {
        return 301 https://mitselect.com/backend;
    }

    # Fallback — everything else to index
    location / {
        try_files $uri /index.html;
        expires 1h;
    }

    # SSL — managed by certbot (run after DNS A record is set)
    # certbot --nginx -d sales.mitselect.com
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sales.mitselect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales.mitselect.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# === HTTP -> HTTPS redirect ===
server {
    listen 80;
    server_name sales.mitselect.com;
    return 301 https://sales.mitselect.com$request_uri;
}
