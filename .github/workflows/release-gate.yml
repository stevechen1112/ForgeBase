name: Complete Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "admin/**"
      - "web/**"
      - "forgebase-site/**"
      - "template-demos/**"
      - "shared/**"
      - "scripts/**"
      - "deploy/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/**"
  push:
    branches: [develop]
    paths:
      - "api/**"
      - "admin/**"
      - "web/**"
      - "forgebase-site/**"
      - "template-demos/**"
      - "shared/**"
      - "scripts/**"
      - "deploy/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API contract
    uses: ./.github/workflows/api.yml

  frontend:
    name: Frontend contract
    uses: ./.github/workflows/frontend.yml

  security:
    name: SAST, secrets, dependencies, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-runtime.txt
            scripts/requirements-security.txt
      - name: Install security gate dependencies
        run: pip install -r api/requirements.txt -r scripts/requirements-security.txt
      - name: Run blocking source and supply-chain security gate
        run: python scripts/run_security_gate.py
      - name: Upload security evidence and Python SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-security-evidence
          path: artifacts/security-gate/
          if-no-files-found: error
          retention-days: 30

  admin-browser-rbac:
    name: Admin browser and RBAC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgebase_browser_test
          POSTGRES_PASSWORD: forgebase_browser_test # pragma: allowlist secret -- CI-only fixture
          POSTGRES_DB: forgebase_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase_browser_test -d forgebase_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://forgebase_browser_test:forgebase_browser_test@localhost:5432/forgebase_browser_test # pragma: allowlist secret -- CI-only fixture
      DATABASE_NULL_POOL: "true"
      SECRET_KEY: browser-release-check-secret-at-least-32-characters # pragma: allowlist secret -- CI-only fixture
      OPENAI_API_KEY: sk-browser-release-check # pragma: allowlist secret -- deliberately non-routable fixture
      AI_MODEL_NAME: gpt-5.6-luna
      EMAIL_DRY_RUN: "true"
      EMAIL_EXTERNAL_DELIVERY_ENABLED: "false"
      OUTREACH_SEND_ENABLED: "false"
      INBOUND_REPLY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-runtime.txt
            scripts/requirements-ui-scan.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install browser gate dependencies
        run: |
          pip install -r api/requirements.txt -r scripts/requirements-ui-scan.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix admin
      - name: Run real Admin browser and API RBAC matrix
        run: python scripts/run_admin_rbac_lab.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-rbac-evidence
          path: artifacts/admin-rbac-lab/
          if-no-files-found: error
          retention-days: 14

  recovery-drill:
    name: Backup, restore, and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated recovery drill
        run: bash deploy/restore-rollback-lab.sh
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-rollback-evidence
          path: artifacts/restore-rollback-lab/
          if-no-files-found: error
          retention-days: 14

  public-locale-browser:
    name: Five-locale public website browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3105
      NEXT_PUBLIC_SITE_NAME: ForgeBase Locale Lab
      FORGEBASE_STRICT_BUILD_API: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ui-scan.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install website browser dependencies
        run: |
          pip install -r scripts/requirements-ui-scan.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix web
      - name: Build the production website
        run: npm run build --prefix web
      - name: Exercise every public locale in Chromium
        run: python scripts/run_public_locale_lab.py
      - name: Upload public locale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-locale-browser-evidence
          path: artifacts/public-locale-lab/
          if-no-files-found: error
          retention-days: 14

  production-images:
    name: Production image / ${{ matrix.label }}
    needs: [api, frontend, security, admin-browser-rbac, recovery-drill, public-locale-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api
            label: API
            context: api
            build_args: ""
          - id: admin
            label: Admin
            context: admin
            build_args: NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1
          - id: web-northforge
            label: NorthForge Web
            context: web
            build_args: |
              NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1
              NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000/northforge-tools
              NEXT_PUBLIC_SITE_NAME=NorthForge Tools
              NEXT_PUBLIC_BASE_PATH=/northforge-tools
              NEXT_PUBLIC_ASSET_BASE=/northforge-tools/demo/handtool-company/assets
          - id: web-precision
            label: AxisForm Web
            context: web
            build_args: |
              NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1
              NEXT_PUBLIC_TENANT_SLUG=axisform-precision
              NEXT_PUBLIC_SITE_URL=http://axisform.example
              NEXT_PUBLIC_SITE_NAME=AxisForm Precision
              NEXT_PUBLIC_BASE_PATH=
              NEXT_PUBLIC_ASSET_BASE=/demo/precision-machining/assets
          - id: marketing
            label: ForgeBase Marketing
            context: forgebase-site
            build_args: NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1
          - id: templates
            label: Template Portfolio
            context: template-demos
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image contract
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: forgebase-ci:${{ matrix.id }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=release-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.id }}
      - name: Prepare container security evidence
        run: mkdir -p artifacts/container-security
      - name: Generate container CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forgebase-ci:${{ matrix.id }}
          format: cyclonedx
          output: artifacts/container-security/${{ matrix.id }}-sbom.cdx.json
          exit-code: "0"
      - name: Record all container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forgebase-ci:${{ matrix.id }}
          format: json
          output: artifacts/container-security/${{ matrix.id }}-vulnerabilities.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "0"
          skip-setup-trivy: true
      - name: Block high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forgebase-ci:${{ matrix.id }}
          format: table
          output: artifacts/container-security/${{ matrix.id }}-vulnerabilities.txt
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ matrix.id }}
          path: artifacts/container-security/
          if-no-files-found: error
          retention-days: 30

  production-compose:
    name: Production topology and deploy scripts
    needs: production-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROTOCOL: https
      DOMAIN: forgebase.example
      APEX_DOMAIN: forgebase.example
      POSTGRES_USER: forgebase_ci
      POSTGRES_PASSWORD: forgebase_ci_password # pragma: allowlist secret -- CI-only fixture
      POSTGRES_DB: forgebase_ci
      REVALIDATE_SECRET: release-ci-revalidate-secret # pragma: allowlist secret -- CI-only fixture
      API_ENV_FILE: ./deploy/api.env.example
      NEXT_PUBLIC_SITE_NAME: ForgeBase CI
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose graph
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate deployment shell syntax
        run: bash -n deploy/*.sh
      - name: Lint recovery and deployment controls
        run: >-
          shellcheck
          deploy/backup.sh
          deploy/restore-drill.sh
          deploy/rollback.sh
          deploy/restore-rollback-lab.sh
          deploy/safe-deploy.sh
