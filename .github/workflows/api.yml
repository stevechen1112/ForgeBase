name: API Release Contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Migration, API suite, and North Star
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgebase_test
          POSTGRES_PASSWORD: forgebase_test # pragma: allowlist secret -- CI-only fixture
          POSTGRES_DB: forgebase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase_test -d forgebase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://forgebase_test:forgebase_test@localhost:5432/forgebase_test # pragma: allowlist secret -- CI-only fixture
      DATABASE_NULL_POOL: "true"
      SECRET_KEY: release-check-secret-key-at-least-32-characters # pragma: allowlist secret -- CI-only fixture
      OPENAI_API_KEY: sk-release-check # pragma: allowlist secret -- deliberately non-routable fixture
      AI_MODEL_NAME: gpt-5.6-luna
      EMAIL_DRY_RUN: "true"
      EMAIL_EXTERNAL_DELIVERY_ENABLED: "false"
      OUTREACH_SEND_ENABLED: "false"
      INBOUND_REPLY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-runtime.txt
      - name: Install API dependencies
        run: |
          pip install -r api/requirements.txt
          mkdir -p artifacts
      - name: Apply every migration
        working-directory: api
        run: alembic upgrade head
      - name: Run unit, integration, tenant, public-form, outbound, and claim tests
        working-directory: api
        run: >-
          pytest -q
          -m "not performance"
          --junitxml=../artifacts/api-tests.junit.xml
          --cov=app
          --cov-report=term-missing
      - name: Verify North Star database contract
        working-directory: api
        run: python scripts/verify_schema_contract.py
      - name: Run frozen AI and public knowledge quality gate
        run: python api/scripts/run_ai_dialogue_eval.py
      - name: Run hermetic North Star full-chain gate
        working-directory: api
        run: >-
          python scripts/run_north_star_lab.py
          --artifacts-dir ../artifacts/north-star-lab
      - name: Run concurrent fault-injection and endurance gate
        working-directory: api
        run: >-
          python scripts/run_fault_injection_endurance.py
          --artifacts-dir ../artifacts/fault-injection-endurance
      - name: Run performance, capacity, and short-soak gate
        working-directory: api
        env:
          # ubuntu-latest is a shared, variable-capacity host. Keep the
          # application/lab default at 40; this is the hosted-runner regression floor.
          FORGEBASE_QUEUE_MIN_JOBS_PER_SECOND: "35"
        run: >-
          python scripts/run_performance_capacity_lab.py
          --artifacts-dir ../artifacts/performance-capacity-soak
      - name: Run replay-safe tenant delivery factory gate
        working-directory: api
        run: >-
          python scripts/run_tenant_delivery_factory_lab.py
          --artifacts-dir ../artifacts/tenant-delivery-factory
      - name: Run privacy and retention operations gate
        working-directory: api
        run: >-
          python scripts/run_privacy_retention_lab.py
          --artifacts-dir ../artifacts/privacy-retention
      - name: Verify category-four retirement boundaries
        run: >-
          python scripts/run_retirement_final_audit.py
          --output artifacts/retirement-final-audit
      - name: Verify product document authority boundaries
        run: python scripts/verify_document_authority.py
      - name: Upload API release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-release-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Python blocking lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.4
      - name: Reject syntax errors and undefined names
        run: >-
          ruff check api/app api/scripts api/tests scripts
          --select E9,F63,F7,F82
