name: API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgebase_test
          POSTGRES_PASSWORD: forgebase_test
          POSTGRES_DB: forgebase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL: postgresql+asyncpg://forgebase_test:forgebase_test@localhost:5432/forgebase_test
          SECRET_KEY: test-secret-key-for-ci-only
          OPENAI_API_KEY: sk-test
          AI_MODEL_NAME: gpt-5.4
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check api/app/

  deploy-staging:
    name: Deploy API to Staging (Linode)
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Only deploy on push to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            cd /opt/forgebase
            git pull origin main
            cd api
            source .venv/bin/activate
            pip install -r requirements.txt --quiet
            alembic upgrade head
            sudo systemctl restart forgebase-api
