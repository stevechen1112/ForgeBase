name: Deploy to Production

on:
  push:
    branches:
      - main

# Prevent concurrent deploys — if a new push comes in, cancel the previous run
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Linode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify production host
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            test -d /opt/forgebase
            test -s /opt/forgebase/.env
            test -s /opt/forgebase/deploy/api.env
            command -v docker
            command -v rsync
            docker compose version
          '

      - name: Sync release files
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" \
            "mkdir -p /opt/forgebase-deploy-backups/$GITHUB_SHA"
          rsync -az --delete --backup \
            --backup-dir="/opt/forgebase-deploy-backups/$GITHUB_SHA" \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.venv/' \
            --exclude '.copilot-extracted/' \
            --exclude 'deploy/api.env' \
            --exclude 'deploy/Caddyfile' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ root@"$DEPLOY_HOST":/opt/forgebase/

      - name: Build and deploy Docker services
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
          '

      - name: Health check
        run: |
          sleep 10
          for i in 1 2 3; do
            STATUS=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" \
              "curl -sf --max-time 10 http://127.0.0.1/health" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unreachable")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 3 attempts"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 50 api web admin caddy
          '
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment succeeded → https://mitselect.com"
          else
            echo "Deployment FAILED — check logs above"
          fi
