name: Deploy to Production

on:
  push:
    branches:
      - main

# Prevent concurrent deploys — if a new push comes in, cancel the previous run
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Complete release gate
    uses: ./.github/workflows/release-gate.yml

  deploy:
    name: Deploy to Linode
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify production host
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            test -d /opt/forgebase
            test -s /opt/forgebase/.env
            test -s /opt/forgebase/deploy/api.env
            command -v docker
            command -v rsync
            docker compose version
          '

      - name: Sync release files
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" \
            "mkdir -p /opt/forgebase-deploy-backups/$GITHUB_SHA"
          rsync -az --delete --backup \
            --backup-dir="/opt/forgebase-deploy-backups/$GITHUB_SHA" \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.venv/' \
            --exclude '.copilot-extracted/' \
            --exclude 'backups/' \
            --exclude 'deploy/api.env' \
            --exclude 'deploy/Caddyfile' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ root@"$DEPLOY_HOST":/opt/forgebase/

      - name: Build and deploy Docker services
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml config --quiet
            # safe-deploy creates a PostgreSQL backup and rollback image
            # manifest before migration, builds every managed application
            # service sequentially, and switches only after the API is healthy.
            bash deploy/safe-deploy.sh
          '

      - name: Health check
        run: |
          set -o pipefail
          sleep 10
          # The web API client intentionally retries a failed backend probe
          # after 60 seconds, so the deployment gate must cover that window.
          for i in $(seq 1 8); do
            STATUS=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" \
              "set -e; cd /opt/forgebase; \
               docker compose -f docker-compose.prod.yml exec -T web \
                 wget -q -O /dev/null http://127.0.0.1:3000/northforge-tools/api/health/assets; \
               docker compose -f docker-compose.prod.yml exec -T web_precision \
                 wget -q -O /dev/null http://127.0.0.1:3000/api/health/assets; \
               docker compose -f docker-compose.prod.yml exec -T admin \
                 wget -q -O /dev/null http://127.0.0.1:3000/backend/login; \
               docker compose -f docker-compose.prod.yml exec -T marketing \
                 wget -q -O /dev/null http://127.0.0.1:3020/; \
               docker compose -f docker-compose.prod.yml exec -T templates \
                 wget -q -O /dev/null http://127.0.0.1/; \
               curl -sf --max-time 10 http://127.0.0.1/health/ready" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unreachable")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ready" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 8 attempts"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 50 api web admin caddy
          '
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment succeeded → https://$DEPLOY_HOST"
          else
            echo "Deployment FAILED — check logs above"
          fi
