name: Deploy to Production

on:
  push:
    branches:
      - main

# Prevent concurrent deploys — if a new push comes in, cancel the previous run
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Linode
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config

      - name: Pull latest code on server
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/forgebase/app
            git checkout -- . || true
            git pull origin main
            # Restore any tracked static assets that may be missing from working tree
            # (git pull does not restore files whose content is unchanged between commits)
            git checkout HEAD -- web/public/demo/handtool-company/assets/
            # Sync nginx config if changed
            if ! diff -q infra/nginx_forgebase.conf /etc/nginx/sites-enabled/forgebase > /dev/null 2>&1; then
              cp infra/nginx_forgebase.conf /etc/nginx/sites-enabled/forgebase
              nginx -t && nginx -s reload
            fi
          '

      - name: Install Python dependencies & apply DB migrations
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/forgebase/app/api
            source .venv/bin/activate
            pip install -r requirements.txt --quiet
            alembic upgrade head
          '

      - name: Restart API service
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            systemctl restart forgebase-api
            sleep 3
            systemctl is-active forgebase-api || (journalctl -u forgebase-api -n 30 && exit 1)
          '

      - name: Rebuild web frontend
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/forgebase/app/web
            npm ci --prefer-offline
            npm run build
          '

      - name: Rebuild admin frontend
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/forgebase/app/admin
            npm ci --prefer-offline
            npm run build
          '

      - name: Restart frontend services
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} '
            set -e
            systemctl restart forgebase-web forgebase-admin
            sleep 3
            systemctl is-active forgebase-web  || (journalctl -u forgebase-web  -n 20 && exit 1)
            systemctl is-active forgebase-admin || (journalctl -u forgebase-admin -n 20 && exit 1)
          '

      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3; do
            STATUS=$(curl -sf --max-time 10 https://mitselect.com/health \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unreachable")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 3 attempts"
          ssh root@${{ secrets.DEPLOY_HOST }} 'journalctl -u forgebase-api -n 30'
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment succeeded → https://mitselect.com"
          else
            echo "Deployment FAILED — check logs above"
          fi
