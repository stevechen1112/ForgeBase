name: Deploy to Production

on:
  push:
    branches:
      - main

# Prevent concurrent deploys — if a new push comes in, cancel the previous run
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  api-checks:
    name: API release checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgebase_test
          POSTGRES_PASSWORD: forgebase_test
          POSTGRES_DB: forgebase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://forgebase_test:forgebase_test@localhost:5432/forgebase_test
      SECRET_KEY: release-check-secret-key-at-least-32-characters
      APP_ENV: test
      OPENAI_API_KEY: sk-release-check
      AI_MODEL_NAME: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: alembic upgrade head
        working-directory: api
      - run: pytest -q
        working-directory: api

  frontend-checks:
    name: Frontend release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run type-check && npm run lint && npm run build
        working-directory: admin
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      - run: npm audit --omit=dev --audit-level=high
        working-directory: admin
      - run: npm ci
        working-directory: web
      - run: npm run type-check && npm run lint && npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_NAME: ForgeBase
          FORGEBASE_STRICT_BUILD_API: "0"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  deploy:
    name: Deploy to Linode
    needs: [api-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify production host
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            test -d /opt/forgebase
            test -s /opt/forgebase/.env
            test -s /opt/forgebase/deploy/api.env
            command -v docker
            command -v rsync
            docker compose version
          '

      - name: Sync release files
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" \
            "mkdir -p /opt/forgebase-deploy-backups/$GITHUB_SHA"
          rsync -az --delete --backup \
            --backup-dir="/opt/forgebase-deploy-backups/$GITHUB_SHA" \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.venv/' \
            --exclude '.copilot-extracted/' \
            --exclude 'deploy/api.env' \
            --exclude 'deploy/Caddyfile' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ root@"$DEPLOY_HOST":/opt/forgebase/

      - name: Build and deploy Docker services
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml config --quiet
            # This host has 2 GB RAM; build the two Next.js images sequentially
            # to avoid swap thrashing and OOM failures.
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml build admin
            docker compose -f docker-compose.prod.yml build web
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
          '

      - name: Health check
        run: |
          set -o pipefail
          sleep 10
          # The web API client intentionally retries a failed backend probe
          # after 60 seconds, so the deployment gate must cover that window.
          for i in $(seq 1 8); do
            STATUS=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" \
              "set -e; cd /opt/forgebase; \
               docker compose -f docker-compose.prod.yml exec -T web \
                 wget -q -O /dev/null http://127.0.0.1:3000/api/health/assets; \
               docker compose -f docker-compose.prod.yml exec -T admin \
                 wget -q -O /dev/null http://127.0.0.1:3000/backend/login; \
               curl -sf --max-time 10 http://127.0.0.1/health/ready" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unreachable")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "ready" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 8 attempts"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 50 api web admin caddy
          '
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment succeeded → https://$DEPLOY_HOST"
          else
            echo "Deployment FAILED — check logs above"
          fi
