name: Frontend Release Contract

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: admin
            label: Admin
            path: admin
          - id: web
            label: Tenant Web
            path: web
          - id: marketing
            label: ForgeBase Marketing
            path: forgebase-site
          - id: templates
            label: Template Portfolio
            path: template-demos
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_NAME: ForgeBase CI
      FORGEBASE_STRICT_BUILD_API: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - name: Verify public locale packs
        if: matrix.id == 'web'
        run: npm run locale:check
      - name: Verify template structure
        if: matrix.id == 'templates'
        run: npm run check:structure
      - run: npm run build
      - name: Verify rendered template compliance
        if: matrix.id == 'templates'
        run: node scripts/check-compliance.mjs
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
