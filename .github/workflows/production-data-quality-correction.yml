name: Production Data Quality Correction

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: Reviewed tenant UUID
        required: true
        type: string
      expected_tenant_name:
        description: Current tenant name from the reviewed audit
        required: true
        type: string
      new_tenant_name:
        description: Correct tenant display name
        required: true
        type: string
      rfq_plan_json:
        description: JSON list of exact id and rfq_number pairs from the reviewed audit
        required: true
        type: string
      reason:
        description: Audit reason for the correction
        required: true
        type: string
      confirm:
        description: Type APPLY_REVIEWED_DATA_QUALITY_PLAN
        required: true
        type: string

concurrency:
  group: production-data-quality-correction
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  correct:
    name: Apply reviewed, replay-safe production corrections
    if: inputs.confirm == 'APPLY_REVIEWED_DATA_QUALITY_PLAN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      FORGEBASE_CONFIRM: ${{ inputs.confirm }}
      FORGEBASE_PRODUCTION_URL: https://pcbrm.tw
      FORGEBASE_TENANT_ID: ${{ inputs.tenant_id }}
      FORGEBASE_EXPECTED_TENANT_NAME: ${{ inputs.expected_tenant_name }}
      FORGEBASE_NEW_TENANT_NAME: ${{ inputs.new_tenant_name }}
      FORGEBASE_RFQ_PLAN_JSON: ${{ inputs.rfq_plan_json }}
      FORGEBASE_CORRECTION_REASON: ${{ inputs.reason }}
      FORGEBASE_CORRECTION_REPORT: artifacts/production-data-quality/correction.json

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create one-run Platform Admin correction operator
        shell: bash
        run: |
          set -euo pipefail
          operator_email="production-data-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@forgebase.com"
          operator_password=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$operator_password"
          printf 'FORGEBASE_PLATFORM_EMAIL=%s\n' "$operator_email" >> "$GITHUB_ENV"
          printf 'FORGEBASE_PLATFORM_PASSWORD=%s\n' "$operator_password" >> "$GITHUB_ENV"
          {
            printf '%s\n' "$operator_email"
            printf '%s\n' "$operator_password"
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            IFS= read -r operator_email
            IFS= read -r operator_password
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml exec -T \
              -e ADMIN_EMAIL="$operator_email" \
              -e ADMIN_PASSWORD="$operator_password" \
              -e ADMIN_IS_SUPERUSER=true \
              -e PYTHONPATH=/app \
              api python scripts/seed_admin_bcrypt.py
          '

      - name: Apply exact reviewed plan through the Platform Admin API
        run: python scripts/apply_production_data_quality_plan.py

      - name: Remove one-run correction operator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FORGEBASE_PLATFORM_EMAIL:-}"
          printf '%s\n' "$FORGEBASE_PLATFORM_EMAIL" | \
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
              set -euo pipefail
              IFS= read -r operator_email
              cd /opt/forgebase
              docker compose -f docker-compose.prod.yml exec -T \
                -e EPHEMERAL_OPERATOR_EMAIL="$operator_email" \
                -e EPHEMERAL_OPERATOR_RUN_ID="'"$GITHUB_RUN_ID"'" \
                -e EPHEMERAL_OPERATOR_RUN_ATTEMPT="'"$GITHUB_RUN_ATTEMPT"'" \
                -e EPHEMERAL_OPERATOR_PURPOSE="data-quality" \
                -e PYTHONPATH=/app \
                api python scripts/remove_ephemeral_platform_operator.py
            '

      - name: Upload correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-data-quality-correction-evidence
          path: artifacts/production-data-quality/correction.json
          if-no-files-found: error
          retention-days: 30
