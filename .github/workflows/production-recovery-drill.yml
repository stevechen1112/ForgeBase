name: Production Recovery Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 1 * *"

concurrency:
  group: production-recovery-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: Restore latest production recovery point into a disposable database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ui-scan.txt

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run isolated restore drill and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            cd /opt/forgebase
            latest_manifest=$(find backups -maxdepth 1 -type f -name "database-*.manifest.json" -print | sort | tail -n 1)
            test -n "$latest_manifest"
            offsite_object_key=$(python3 - "$latest_manifest" <<"PY"
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["schema_version"] == 1
          assert payload["status"] == "passed"
          assert payload["offsite_status"] == "passed"
          print(payload["offsite_object_key"])
          PY
            )
            test -n "$offsite_object_key"
            bash deploy/restore-drill.sh --offsite "$offsite_object_key"
            python3 - <<"PY"
          import json
          from pathlib import Path

          evidence = json.loads(Path("backups/recovery-evidence/status.json").read_text(encoding="utf-8"))
          assert evidence["schema_version"] == 1
          assert evidence["evidence_status"] == "verified"
          assert evidence["last_backup_at"]
          assert evidence["last_restore_drill_at"]
          print("Production recovery evidence verified")
          PY
          '

      - name: Install production browser verifier
        run: |
          python -m pip install -r scripts/requirements-ui-scan.txt
          python -m playwright install --with-deps chromium

      - name: Create one-run Platform Admin browser verifier
        shell: bash
        run: |
          set -euo pipefail
          operator_email="production-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@forgebase.com"
          operator_password=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$operator_password"
          printf 'FORGEBASE_PLATFORM_EMAIL=%s\n' "$operator_email" >> "$GITHUB_ENV"
          printf 'FORGEBASE_PLATFORM_PASSWORD=%s\n' "$operator_password" >> "$GITHUB_ENV"
          {
            printf '%s\n' "$operator_email"
            printf '%s\n' "$operator_password"
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
            set -euo pipefail
            IFS= read -r operator_email
            IFS= read -r operator_password
            cd /opt/forgebase
            docker compose -f docker-compose.prod.yml exec -T \
              -e ADMIN_EMAIL="$operator_email" \
              -e ADMIN_PASSWORD="$operator_password" \
              -e ADMIN_IS_SUPERUSER=true \
              -e PYTHONPATH=/app \
              api python scripts/seed_admin_bcrypt.py
          '

      - name: Verify recovery evidence in the real Platform Admin UI
        env:
          FORGEBASE_PRODUCTION_URL: https://pcbrm.tw
          FORGEBASE_BROWSER_EVIDENCE_DIR: artifacts/production-admin
        run: python scripts/verify_production_platform_resources.py

      - name: Remove one-run Platform Admin browser verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FORGEBASE_PLATFORM_EMAIL:-}"
          printf '%s\n' "$FORGEBASE_PLATFORM_EMAIL" | \
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@"$DEPLOY_HOST" '
              set -euo pipefail
              IFS= read -r operator_email
              cd /opt/forgebase
              docker compose -f docker-compose.prod.yml exec -T \
                -e EPHEMERAL_OPERATOR_EMAIL="$operator_email" \
                -e EPHEMERAL_OPERATOR_RUN_ID="'"$GITHUB_RUN_ID"'" \
                -e EPHEMERAL_OPERATOR_RUN_ATTEMPT="'"$GITHUB_RUN_ATTEMPT"'" \
                -e PYTHONPATH=/app \
                api python scripts/remove_ephemeral_platform_operator.py
            '

      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-recovery-browser-evidence
          path: artifacts/production-admin/
          if-no-files-found: error
          retention-days: 30
